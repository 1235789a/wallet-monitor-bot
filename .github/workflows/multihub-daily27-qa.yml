name: MultiHub Daily 27 QA
on:
  pull_request:
    paths:
      - "scripts/validate_daily_evidence.py"
      - "scripts/test_validate_daily_evidence.py"
      - ".github/workflows/multihub-daily27-qa.yml"
      - "prospect-os-workflow1/prospect_os/**"
      - "scripts/run_daily27_pipeline.py"
      - "scripts/validate_daily27_production.py"
      - "scripts/test_daily27_runtime.py"
      - "scripts/test_wa_website_preflight.py"
      - "scripts/test_wa_batch_intake.py"
      - "scripts/test_history_archive_merge.py"
      - "scripts/test_history_v32.py"
      - "scripts/audit_history_v32.py"
      - "scripts/merge_private_history_archives.py"
      - "scripts/run_wa_resume_presented.py"
      - "scripts/run_wa_website_preflight.py"
      - "requirements-wa-preflight.txt"
      - "prospect-os-workflow1/test_outreach*.py"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production PNG dependency
        run: python -m pip install Pillow -r requirements-wa-preflight.txt
      - name: Test legacy validator (preserved)
        run: python -m unittest discover -s scripts -p "test_validate_daily_evidence.py" -v
      - name: Test new Daily27 pipeline
        run: python scripts/test_daily27_runtime.py
      - name: Test WA website preflight (offline fixtures)
        run: python scripts/test_wa_website_preflight.py
      - name: Test WA strict intake and history precheck
        run: python scripts/test_wa_batch_intake.py
      - name: Test history reconciliation and continuation
        run: python scripts/test_history_archive_merge.py
      - name: Test V3.2 history integrity and state conflicts
        run: python scripts/test_history_v32.py
      - name: Test outreach copy and conversation Humanizer
        working-directory: prospect-os-workflow1
        run: python -m unittest test_outreach_copy test_outreach_humanizer -v
