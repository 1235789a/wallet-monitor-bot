name: MultiHub Daily 27 QA
on:
  pull_request:
    paths:
      - "scripts/validate_daily_evidence.py"
      - "scripts/test_validate_daily_evidence.py"
      - ".github/workflows/multihub-daily27-qa.yml"
      - "prospect-os-workflow1/prospect_os/**"
      - "scripts/run_daily27_pipeline.py"
      - "scripts/validate_daily27_production.py"
      - "scripts/test_daily27_runtime.py"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production PNG dependency
        run: python -m pip install Pillow
      - name: Test legacy validator (preserved)
        run: python -m unittest discover -s scripts -p "test_validate_daily_evidence.py" -v
      - name: Test new Daily27 pipeline
        run: python scripts/test_daily27_runtime.py
